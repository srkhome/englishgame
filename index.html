<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼讀大富翁 - 單人版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root{
  --ink:#233238;
  --paper:#FBF6EC;
  --panel:#FFFFFF;
  --line:#D9D2C2;
  --teal:#1F4E5F;
  --teal-dark:#123644;
  --gold:#E8A93B;
  --at:#E4572E;
  --an:#F2994A;
  --og:#D6B322;
  --un:#5FA75A;
  --ig:#3D8FC4;
  --ay:#5B6EE1;
  --ee:#9B6FD9;
  --ook:#D4568C;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Noto Sans TC', sans-serif;
  background:
    radial-gradient(circle at 1px 1px, #E7DFCB 1.4px, transparent 1.4px) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  padding:20px;
}
h1,h2,h3{font-family:'Baloo 2','Noto Sans TC',sans-serif; margin:0;}
.wrap{max-width:1180px;margin:0 auto;}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.title{display:flex;align-items:center;gap:10px;}
.title .badge{
  width:38px;height:38px;border-radius:10px;background:var(--teal);
  display:flex;align-items:center;justify-content:center;
  box-shadow: 0 3px 0 var(--teal-dark);
}
.title .badge::before,.title .badge::after{
  content:'';width:7px;height:7px;border-radius:50%;background:#fff;
}
.title .badge{gap:5px;}
.title h1{font-size:24px;font-weight:800;color:var(--teal-dark);}
.title span{display:block;font-size:12px;color:#7A7261;font-weight:500;}
.btn{
  font-family:inherit;font-size:14px;font-weight:700;
  border:2px solid var(--teal-dark);background:#fff;color:var(--teal-dark);
  padding:9px 16px;border-radius:10px;cursor:pointer;
  box-shadow:0 3px 0 var(--teal-dark);
  transition:transform .08s;
}
.btn:hover{background:#F2EEE0;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-dark);}
.btn.primary{background:var(--teal);color:#fff;}
.btn.primary:hover{background:var(--teal-dark);}
.btn.gold{background:#E6A817;color:#fff;box-shadow:0 3px 0 #B9860F;}
.btn.gold:hover{background:#CC9412;}
.btn.gold{background:var(--gold);border-color:#A8721E;box-shadow:0 3px 0 #A8721E;color:#3A2708;}
.btn.gold:active{box-shadow:0 1px 0 #A8721E;}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
.btn.small{padding:6px 11px;font-size:12px;border-width:1.5px;box-shadow:0 2px 0 var(--teal-dark);}

.layout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
.board-col{flex:1 1 640px;min-width:340px;}
.side-col{flex:0 0 300px;display:flex;flex-direction:column;gap:14px;}

.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(7,1fr);
  gap:5px;
  aspect-ratio:1/1;
  width:100%;
  background:#E9E1CC;
  border:3px solid var(--teal-dark);
  border-radius:16px;
  padding:6px;
}
.sq{
  position:relative;
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:2px;
  overflow:hidden;
}
.sq .studs{position:absolute;top:3px;left:0;right:0;display:flex;justify-content:center;gap:5px;}
.sq .studs i{width:7px;height:7px;border-radius:50%;display:block;}
.sq .lab{font-size:9.5px;font-weight:700;line-height:1.15;margin-top:9px;color:#4A463C;}
.sq .fam{font-size:12px;font-weight:800;margin-top:2px;}
.sq.corner{border-radius:10px;border-width:2px;}
.sq.corner .lab{font-size:10px;margin-top:0;font-weight:800;color:var(--teal-dark);}
.sq.card{background:#FBF0DC;}
.sq.card .lab{color:#8A5E10;}
.sq.owned{box-shadow:inset 0 0 0 3px var(--own-c, #999);}
.sq .lvl{position:absolute;bottom:3px;right:4px;font-size:9px;font-weight:800;}
.sq .ability-icon{position:absolute;top:2px;right:3px;font-size:10px;line-height:1;cursor:help;}
.tokenLayer{position:absolute;inset:0;pointer-events:none;z-index:5;}
.piece{position:absolute;top:0;left:0;width:0;height:0;}
.piece-body{
  width:36px;height:52px;
  transform:translate(-50%,-100%);
  transform-origin:50% 100%;
}
.piece-body svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.piece-body.hop{animation:hopJump .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes hopJump{
  0%{transform:translate(-50%,-100%) scale(1,1);}
  40%{transform:translate(-50%,-142%) scale(1.06,.9);}
  70%{transform:translate(-50%,-92%) scale(.94,1.08);}
  100%{transform:translate(-50%,-100%) scale(1,1);}
}

.center-panel{
  position:absolute;
  z-index:10;
  top:calc(100%/7 + 6px);left:calc(100%/7 + 6px);
  right:calc(100%/7 + 6px);bottom:calc(100%/7 + 6px);
  background:var(--panel);
  border:2.5px solid var(--teal-dark);
  border-radius:14px;
  padding:14px;
  display:flex;flex-direction:column;
  gap:8px;
}
.turn-line{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.turn-who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--teal-dark);}
.dot{width:13px;height:13px;border-radius:50%;flex:none;}
.round-tag{font-size:11px;color:#8A8371;font-weight:700;background:#F2EEE0;padding:3px 9px;border-radius:20px;}

.msgbox{
  flex:1;min-height:0;overflow-y:auto;
  background:#F6F1E4;border-radius:10px;padding:8px 10px;
  font-size:12.5px;line-height:1.6;color:#4A463C;
}
.msgbox p{margin:0 0 4px;}
.msgbox p.me{color:var(--teal-dark);font-weight:700;}

.action-area{display:flex;flex-direction:column;gap:8px;}
.family-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-weight:800;font-size:13px;padding:4px 10px;border-radius:20px;
  align-self:flex-start;
}
.timerbar{height:6px;background:#EADFC5;border-radius:4px;overflow:hidden;}
.timerbar > div{height:100%;background:var(--gold);width:100%;transition:width .1s linear;}
.spell-row{display:flex;gap:6px;}
.spell-row input{
  flex:1;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;
  padding:8px 10px;border-radius:8px;border:2px solid var(--line);
  text-transform:lowercase;
}
.spell-row input:focus{outline:none;border-color:var(--teal);}
.hint-line{font-size:11.5px;color:#8A5E10;}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;}

.side-card{
  background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
}
.side-card h3{font-size:13px;color:var(--teal-dark);margin-bottom:8px;}
.player-row{
  display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);
  font-size:13px;
}
.player-row:last-child{border-bottom:none;}
.player-row .pdot{width:12px;height:12px;border-radius:50%;flex:none;}
.player-row .pname{font-weight:700;flex:1;}
.player-row .pmoney{font-weight:700;color:var(--teal-dark);}
.player-row.dead{opacity:.4;text-decoration:line-through;}
.fam-legend{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.fam-chip{
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:4px 6px;border-radius:6px;background:#F6F1E4;
}
.fam-chip .sw{width:9px;height:9px;border-radius:50%;flex:none;}

.overlay{
  position:fixed;inset:0;background:#2A2013AA;display:flex;align-items:center;justify-content:center;z-index:50;
  padding:20px;
}
.overlay .card{
  background:var(--panel);border-radius:16px;padding:26px 30px;max-width:420px;width:100%;
  box-shadow:0 12px 0 var(--teal-dark);
  text-align:center;
}
.overlay h2{color:var(--teal-dark);font-size:22px;margin-bottom:10px;}
.overlay .rank{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;font-weight:700;}
.overlay .rank:last-child{border-bottom:none;}

.help{font-size:12.5px;color:#7A7261;line-height:1.7;background:#F6F1E4;border-radius:10px;padding:12px 14px;}
.help b{color:var(--teal-dark);}
.help h4{margin:14px 0 5px;font-size:13.5px;color:var(--teal-dark);}
.help h4:first-child{margin-top:0;}
.help ol,.help ul{margin:2px 0 4px;padding-left:19px;}
.help li{margin-bottom:4px;}
.help .tag{display:inline-block;background:#EADFC4;color:#6B5F45;border-radius:5px;padding:0 5px;font-weight:700;font-size:11.5px;}

@media (max-width:760px){
  .side-col{flex:1 1 100%;}
  .board{gap:3px;padding:4px;}
  .sq .lab{font-size:7.5px;}
  .sq .fam{font-size:9px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <div class="badge"></div>
      <div>
        <h1>拼讀大富翁</h1>
        <span>單人版・對戰電腦玩家・用英霸積木拼讀法前進</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn small" id="helpBtn">遊戲說明</button>
      <button class="btn small" id="restartBtn">重新開始</button>
    </div>
  </div>

  <div id="helpPanel" class="help" style="display:none;margin-bottom:14px;"></div>

  <div class="layout">
    <div class="board-col">
      <div class="board" id="board"></div>
    </div>
    <div class="side-col">
      <div class="side-card">
        <h3>玩家狀態</h3>
        <div id="playersList"></div>
      </div>
      <div class="side-card">
        <h3>字母串家族</h3>
        <div class="fam-legend" id="famLegend"></div>
      </div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" style="display:none;"></div>

function squareCoord(i){
  if(i<=6) return {col:i, row:6};
  if(i<=12) return {col:6, row:6-(i-6)};
  if(i<=18) return {col:6-(i-12), row:0};
  return {col:0, row:i-18};
}
function isCorner(i){ return i===0||i===6||i===12||i===18; }
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

// 依單字長度／難度決定骰子數量與計算方式，讓拼出更長的字更有成就感
function rollForWord(word){
  const n = word.length;
  if(n<=3){
    const d = rollDice();
    return { dice:[d], steps:d, mode:'single' };
  } else if(n<=5){
    const d1 = rollDice(), d2 = rollDice();
    return { dice:[d1,d2], steps: Math.max(d1,d2), mode:'high' };
  } else {
    const d1 = rollDice(), d2 = rollDice();
    return { dice:[d1,d2], steps: d1+d2, mode:'sum' };
  }
}
function diceResultText(r){
  if(r.mode==='single') return '骰出 '+r.dice[0]+' 點';
  if(r.mode==='high') return '骰出 '+r.dice.join('、')+'，取較高 '+r.steps+' 點';
  return '骰出 '+r.dice.join('+')+' = '+r.steps+' 步';
}

// 地產特色能力：檢查玩家名下是否擁有具備某項能力的地產
function ownsAbility(p, abilityKey){
  return Object.keys(p.owned).some(k=>{
    const idx = parseInt(k.split(':')[1],10);
    return BOARD[idx] && BOARD[idx].ability===abilityKey;
  });
}
// 依地產等級（小屋1/大屋2/飯店3，尚未達小屋門檻也算1）回傳能力倍率；沒有該能力回傳0
function abilityMultiplier(p, abilityKey){
  let best = 0;
  Object.keys(p.owned).forEach(k=>{
    const idx = parseInt(k.split(':')[1],10);
    if(BOARD[idx] && BOARD[idx].ability===abilityKey){
      const lvl = Math.max(1, levelIndex(p.owned[k]));
      if(lvl>best) best = lvl;
    }
  });
  return best;
}
function effectiveMaxHints(p){
  const base = (HINT_CONFIG[game.aiDifficulty] || HINT_CONFIG.medium).max;
  return base + (ownsAbility(p,'library') ? 1 : 0);
}

function tryLetterFusion(p, family, word){
  const fusionFamily = FAMILY_KEYS.find(fk=> fk!==family && word.includes(fk) && Object.keys(p.owned).some(k=>k.startsWith(fk+':')));
  if(!fusionFamily) return null;
  const fKeys = Object.keys(p.owned).filter(k=>k.startsWith(fusionFamily+':'));
  const fk = fKeys[Math.floor(Math.random()*fKeys.length)];
  p.owned[fk] += 1;
  log('🧬 字母融合！「'+word+'」同時包含「'+family+'」和「'+fusionFamily+'」，額外升級了一塊 '+FAMILIES[fusionFamily].label+' 家族地產！', p.isHuman);
  return fusionFamily;
}

function checkFamilyAlbum(p, family, word){
  if(!p.familyProgress[family]) p.familyProgress[family] = new Set();

  if(p.familyProgress[family].size>=total && !p.familyMastered.has(family)){

  const candidates = EVENT_CANDIDATE_ROUNDS.slice();
  for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  const eventKeys = Object.keys(EVENT_TYPES);
  const roundEvents = {};
  candidates.slice(0,3).forEach((r,i)=>{ roundEvents[r] = eventKeys[i % eventKeys.length]; });
  return {
    players,
    round: 1,
    wordRounds: {},
    turnIdx:0,
    log:[],
    pending:null,
    gameOver:false,
    aiDifficulty: aiDifficulty || 'medium',
    rareWordsUsed: new Set(),
    bossPropertySlot: null,
    bossPropertyBonus: {},
    roundEvents,
    activeEvent: null,
    finalBossDone: false,
  };
}

function log(msg, mine){
  game.log.push({msg, mine});
  if(game.log.length>60) game.log.shift();
}

function ownerOf(familyKey, slotIndex){
  for(const p of game.players){
    const key = familyKey+':'+slotIndex;
    if(p.owned[key]) return p;
  }
  return null;
}

function levelIndex(count){
  let li=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(count>=LEVELS[i].need){li=i;break;} }
  return li;
}

const PIECE_OFFSETS = [[-14,0],[14,0],[0,13]];
const PAWN_SVG =
  '<svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">'
    +'<ellipse cx="12" cy="29.5" rx="7.2" ry="2" fill="rgba(0,0,0,.28)"/>'

    +'<ellipse cx="12" cy="15.5" rx="3.1" ry="1.5" style="fill:var(--pc,#2F80ED)" stroke="#fff" stroke-width="1"/>'
    +'<circle cx="12" cy="8.6" r="6.3" style="fill:var(--pc,#2F80ED)" stroke="#fff" stroke-width="1.2"/>'
    +'<ellipse cx="9.6" cy="5.9" rx="1.7" ry="2.3" fill="rgba(255,255,255,.5)"/>'
  +'</svg>';
function positionTokens(hop){
  const board = document.getElementById('board');
  const layer = document.getElementById('tokenLayer');
  if(!board || !layer) return;
  const boardRect = board.getBoundingClientRect();
  if(boardRect.width===0) return; // board not laid out yet
  game.players.forEach((p, idx)=>{
    let wrap = document.getElementById('piece-'+p.id);
    let body;
    if(!wrap){
      wrap = document.createElement('div');
      wrap.id = 'piece-'+p.id;
      wrap.className = 'piece';
      body = document.createElement('div');
      body.className = 'piece-body';
      body.style.setProperty('--pc', p.color);
      body.innerHTML = PAWN_SVG;
      wrap.appendChild(body);
      layer.appendChild(wrap);
    } else {
      body = wrap.querySelector('.piece-body');
    }
    if(p.out){ wrap.style.display='none'; return; }
    wrap.style.display='block';
    const sqEl = board.querySelector('[data-idx="'+p.pos+'"]');
    if(!sqEl) return;
    const r = sqEl.getBoundingClientRect();
    const cx = r.left - boardRect.left + r.width/2;
    const cy = r.top - boardRect.top + r.height/2;
    const off = PIECE_OFFSETS[idx%PIECE_OFFSETS.length];
    wrap.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
    wrap.style.transform = 'translate('+(cx+off[0])+'px,'+(cy+off[1])+'px)';
    if(hop){
      body.classList.remove('hop');
      void body.offsetWidth;
      body.classList.add('hop');
    }
  });
}

// ---------- turn flow ----------
function startTurn(){
  if(game.gameOver) return;
  const p = game.players[game.turnIdx];
  if(p.out){ nextTurn(); return; }
  if(p.turns >= ROUNDS){ nextTurn(); return; }
  p.turns++;
  if(p.skip){
    p.skip = false;
    log(p.name+' 正在複習關休息，暫停一輪。', p.isHuman);
    render();
    setTimeout(nextTurn, p.isHuman?700:500);
    return;
  }
  if(p.isHuman){
    render('<button class="btn primary" id="spinBtn" style="width:100%;">🔤 抽字母串，拼字前進</button>'
      + (!p.luckyDiceUsed ? '<button class="btn gold" id="luckyBtn" style="width:100%;margin-top:6px;">🎲 使用幸運骰（本場僅1次，自選步數）</button>' : ''));
    document.getElementById('spinBtn').onclick = ()=> beginSpellChallenge('move');
    const luckyBtn = document.getElementById('luckyBtn');
    if(luckyBtn) luckyBtn.onclick = ()=> showLuckyDicePicker(p);
  } else {
    if(!p.luckyDiceUsed && Math.random()<0.15){
      p.luckyDiceUsed = true;
      const n = Math.floor(Math.random()*6)+1;
      log(p.name+' 使用了幸運骰，直接前進 '+n+' 步！', p.isHuman);
      render();
      setTimeout(()=> movePlayer(p, n), 600);
      return;
    }
    render();
    setTimeout(()=> beginSpellChallenge('move'), 700);
  }
}

function showLuckyDicePicker(p){
  render('<div style="font-size:13px;font-weight:700;margin-bottom:8px;">🎲 幸運骰：選擇要直接前進的步數（本場只能用一次）</div>'
    +'<div class="choice-row" style="flex-wrap:wrap;gap:6px;">'
      + [1,2,3,4,5,6].map(n=>'<button class="btn primary small" data-n="'+n+'" style="min-width:40px;">'+n+'</button>').join('')
    +'</div>'
    +'<button class="btn small" id="luckyCancel" style="margin-top:8px;">取消</button>');
  document.querySelectorAll('[data-n]').forEach(btn=>{
    btn.onclick = ()=>{
      const n = parseInt(btn.dataset.n,10);
      p.luckyDiceUsed = true;
      log('你使用了幸運骰，直接前進 '+n+' 步！', true);
      movePlayer(p, n);
    };
  });
  document.getElementById('luckyCancel').onclick = ()=> startTurn();
}

function nextTurn(){
  game.players[game.turnIdx].turns = game.players[game.turnIdx].turns || 0;
  game.turnIdx = (game.turnIdx+1) % game.players.length;
  let enteredNewRound = false;
  if(game.turnIdx===0){ game.round++; enteredNewRound = true; }
  if(enteredNewRound) game.activeEvent = game.roundEvents[game.round] || null;
  if(enteredNewRound && game.activeEvent){
    const ev = EVENT_TYPES[game.activeEvent];
    log('📅 第 '+game.round+' 輪事件：'+ev.label+'！'+ev.desc, true);
  }
  const anyActive = game.players.some(p=>!p.out);
  const allDone = game.players.every(p=> p.out || p.turns>=ROUNDS);
  if(!anyActive || allDone){
    if(anyActive && !game.finalBossDone){
      game.finalBossDone = true;
      setTimeout(runFinalBoss, 300);
      return;
    }
    endGame(); return;
  }
  if(enteredNewRound && game.round<=ROUNDS && game.round % BOSS_ROUND_INTERVAL === 0){
    setTimeout(runBossRound, 300);
    return;
  }
  setTimeout(startTurn, 250);
}

let bossCallback = null;
function runBossRound(){
  // 每次 Boss Round 也重新指定一塊「超級地產」（若尚未被奪走）
  const propertyIndices = BOARD.map((d,i)=> d.type==='property' ? i : -1).filter(i=> i>=0 && !ownerOf(BOARD[i].family,i));
  if(propertyIndices.length){
    game.bossPropertySlot = propertyIndices[Math.floor(Math.random()*propertyIndices.length)];
    const slotDef = BOARD[game.bossPropertySlot];
    log('👑 本輪的超級地產出現在「'+FAMILIES[slotDef.family].label+' 家族 '+slotDef.label.split(' ').pop()+'」，拼對就能直接奪得永久五星地產！', true);
  }
  const family = FAMILY_KEYS[Math.floor(Math.random()*FAMILY_KEYS.length)];
  log('👑 Boss Round！全員挑戰「'+FAMILIES[family].label+'」家族的單字，成功的前三名依序獲得 5／3／1 枚代幣！', true);
  render();
  const order = game.players.slice();
  const results = [];
  let idx = 0;
  function next(){
    if(idx>=order.length){ finish(); return; }
    const p = order[idx];
    idx++;
    log((p.isHuman?'你':p.name)+' 的 Boss Round 挑戰！', p.isHuman);
    bossAttempt(p, family, (success)=>{ results.push({p, success}); setTimeout(next, 300); });
  }
  function finish(){
    const winners = results.filter(r=>r.success);
    const rewards = [5,3,1];
    winners.forEach((r,i)=>{
      const bonus = rewards[i];
      if(bonus){
        r.p.money += bonus;
        r.p.bossWins = (r.p.bossWins||0)+1;
        log((r.p.isHuman?'你':r.p.name)+' 在 Boss Round 拿下第 '+(i+1)+' 名，獲得 '+bonus+' 枚代幣！', r.p.isHuman);
        checkMoneyAchievements(r.p);
      }
    });
    if(winners.length===0) log('這次 Boss Round 沒有人成功拼對，殘念！', true);
    render();
    setTimeout(startTurn, 900);
  }
  setTimeout(next, 400);
}
function bossAttempt(p, family, callback){
  bossCallback = callback;
  if(p.isHuman){
    beginSpellChallenge('boss', family);
  } else {
    setTimeout(()=> botAttempt(p, family, 'boss'), 500);
  }
}

// ── 最終 BOSS（第 15 輪結束前的收尾挑戰）──
let finalBossCallback = null;
function runFinalBoss(){
  const shuffled = FAMILY_KEYS.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  const chosen = shuffled.slice(0,3);
  log('🔥 最終 BOSS 挑戰！請拼出一個同時包含至少兩個字根的單字：'+chosen.join('、')+'！成功可獲得 +20 分！', true);
  render();
  const order = game.players.slice();
  let idx = 0;
  function next(){
    if(idx>=order.length){ finish(); return; }
    const p = order[idx];
    idx++;
    log((p.isHuman?'你':p.name)+' 的最終 BOSS 挑戰！', p.isHuman);
    finalBossAttempt(p, chosen, ()=> setTimeout(next, 300));
  }
  function finish(){ render(); setTimeout(()=> endGame(), 900); }
  setTimeout(next, 400);
}
function finalBossAttempt(p, families, callback){
  finalBossCallback = callback;
  if(!p.isHuman){
    setTimeout(()=>{
      const chance = (DIFFICULTY_CHANCES[game.aiDifficulty]||0.75) * 0.7;
      const success = Math.random() < chance;
      if(success){
        p.money += 20;
        p.bossWins = (p.bossWins||0)+1;
        log((p.isHuman?'你':p.name)+' 完成最終 BOSS 挑戰！獲得 +20 分！', p.isHuman);
      } else {
        log(p.name+' 沒能完成最終 BOSS 挑戰。', p.isHuman);
      }
      render();
      const cb = finalBossCallback; finalBossCallback = null;
      if(typeof cb==='function') cb();
    }, 700);
    return;
  }
  let timeLeft = 30000;
  const startHtml = '<div style="font-size:13px;font-weight:700;margin-bottom:4px;">🔥 最終 BOSS：拼出同時包含至少兩個字根的單字（'+families.join('、')+'）</div>'
    +'<div class="timerbar" style="margin-top:6px;"><div id="timerFill"></div></div>'
    +'<div class="spell-row" style="margin-top:8px;"><input type="text" id="spellInput" placeholder="輸入單字" autocomplete="off"><button class="btn primary small" id="submitSpell">送出</button></div>';
  render(startHtml);
  const input = document.getElementById('spellInput');
  input.focus();
  let submitted = false;
  const submit = async ()=>{
    if(submitted) return;
    submitted = true;
    clearInterval(timerInt);
    const val = (input.value||'').trim().toLowerCase();
    document.getElementById('submitSpell').disabled = true;
    input.disabled = true;
    const matchCount = families.filter(fam=> val.includes(fam)).length;
    let ok = false;
    if(matchCount>=2 && /^[a-z]+$/.test(val) && val.length>=3){
      if(KNOWN_WORDS.has(val)) ok = true;
      else {
        const r = await isRealWord(val);
        ok = (r===true);
      }
    }
    if(ok){
      p.money += 20;
      p.bossWins = (p.bossWins||0)+1;
      log('你完成最終 BOSS 挑戰，拼出 "'+val+'"！獲得 +20 分！', true);
    } else {
      log('最終 BOSS 挑戰失敗（需同時包含至少兩個字根：'+families.join('、')+'）。', true);
    }
    render();
    const cb = finalBossCallback; finalBossCallback = null;
    if(typeof cb==='function') cb();
  };
  document.getElementById('submitSpell').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  const fill = document.getElementById('timerFill');
  const total = timeLeft;
  timerInt = setInterval(()=>{
    timeLeft -= 100;
    if(fill) fill.style.width = Math.max(0,(timeLeft/total*100))+'%';
    if(timeLeft<=0){ clearInterval(timerInt); submit(); }
  }, 100);
}

let currentFamily = null;
let timerInt = null;

function beginSpellChallenge(purpose, forcedFamily){
  const p = game.players[game.turnIdx];
  const family = forcedFamily || FAMILY_KEYS[Math.floor(Math.random()*FAMILY_KEYS.length)];
  currentFamily = family;
  const f = FAMILIES[family];

  if(purpose==='move'){
    log(p.name+' 抽到了 '+f.label+' 家族！', p.isHuman);
    p._prevFamilyForChain = p.lastFamily;
    if(family === p.lastFamily){ p.familyRepeatCount = (p.familyRepeatCount||1) + 1; }
    else { p.familyRepeatCount = 1; }
    p._familyRepeatAtDraw = p.familyRepeatCount;
    p.lastFamily = family;
  }

  if(!p.isHuman){
    setTimeout(()=> botAttempt(p, family, purpose), 700);
    return;
  }

  const maxHints = effectiveMaxHints(p);
  const hintCfg = HINT_CONFIG[game.aiDifficulty] || HINT_CONFIG.medium;
  let timeLeft = timeLimitForRound(game.round);
  const startHtml =
    famChip(family)
    +'<div class="timerbar" style="margin-top:6px;"><div id="timerFill"></div></div>'
    +'<div class="spell-row" style="margin-top:8px;">'
      +'<input type="text" id="spellInput" placeholder="輸入一個包含「'+f.label+'」的英文單字" autocomplete="off">'
      +'<button class="btn primary small" id="submitSpell">送出</button>'
    +'</div>'
    +'<div class="hint-line" id="hintLine">提示：用了提示後這次不擲骰子、固定只前進 1 格，本場還可以用 '+(maxHints-p.hintsUsed)+' 次。</div>'
    +'<button class="btn small" id="hintBtn" style="align-self:flex-start;"'+(p.hintsUsed>=maxHints?' disabled':'')+'>需要提示（剩 '+(maxHints-p.hintsUsed)+' 次）</button>';
  render(startHtml);
  const input = document.getElementById('spellInput');
  input.focus();
  let usedHint = false;
  let submitted = false;
  document.getElementById('hintBtn').onclick = ()=>{
    if(p.hintsUsed >= maxHints) return;
    p.hintsUsed++;
    const avail = f.words.filter(w=> !wordOnCooldown(w));
    const w = avail[Math.floor(Math.random()*avail.length)] || f.words[0];
    const showFullWord = p.hintsUsed <= hintCfg.fullWordCount;
    document.getElementById('hintLine').textContent = showFullWord
      ? '提示單字：'+w+'（本場還可以用 '+(maxHints-p.hintsUsed)+' 次）'
      : '提示：試著想一個含有「'+f.label+'」且以「'+w[0].toUpperCase()+'」開頭的單字！（本場還可以用 '+(maxHints-p.hintsUsed)+' 次）';
    const hb = document.getElementById('hintBtn');
    hb.textContent = '需要提示（剩 '+(maxHints-p.hintsUsed)+' 次）';
    if(p.hintsUsed>=maxHints) hb.disabled = true;
    usedHint = true;
  };
  const submit = async ()=>{
    if(submitted) return;
    submitted = true;
    clearInterval(timerInt);
    const val = input.value.trim().toLowerCase();
    const btn = document.getElementById('submitSpell');
    const hintLineEl = document.getElementById('hintLine');
    if(btn) btn.disabled = true;
    if(input) input.disabled = true;
    if(val && hintLineEl) hintLineEl.textContent = '查詢字典確認中…';
    await resolveSpellAttempt(p, family, val, purpose, usedHint);
  };
  document.getElementById('submitSpell').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });

  const fill = document.getElementById('timerFill');
  const total = timeLeft;
  timerInt = setInterval(()=>{
    timeLeft -= 100;
    if(fill) fill.style.width = Math.max(0,(timeLeft/total*100))+'%';
    if(timeLeft<=0){
      clearInterval(timerInt);
      submit();
    }
  }, 100);
}

function isValidWord(family, word){
  if(!word) return false;
  if(!/^[a-z]+$/.test(word)) return false;
  if(word.length < 3) return false;
  if(word === family) return false;
  if(!word.includes(family)) return false;
  return true;
}

const dictCache = {};
async function isRealWord(word){
  if(Object.prototype.hasOwnProperty.call(dictCache, word)) return dictCache[word];
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), 4000);
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word), {signal: controller.signal});
    clearTimeout(timer);
    const ok = res.ok;
    dictCache[word] = ok;
    return ok;
  } catch(e){
    return null; // 無法連線或逾時，交由內建字庫判斷
  }
}

function botAttempt(p, family, purpose){
  const f = FAMILIES[family];
  let successChance = DIFFICULTY_CHANCES[game.aiDifficulty] || 0.75;
  const pers = AI_PERSONALITIES[p.personality];
  if(pers){
    successChance += (pers.successBonus||0);
    if(pers.lateGameBonus){
      if(game.round<=5) successChance -= 0.15;
      else if(game.round>=11) successChance += 0.15;
    }
  }
  successChance = Math.min(0.97, Math.max(0.25, successChance));
  const success = Math.random() < successChance;
  let word = '';
  if(success){
    let pool = f.words.filter(w=> !wordOnCooldown(w));
    if(pool.length===0){ resolveSpellAttempt(p, family, '', purpose, false); return; }
    word = pool[Math.floor(Math.random()*pool.length)];
  }
  resolveSpellAttempt(p, family, word, purpose, false);
}

async function resolveSpellAttempt(p, family, word, purpose, usedHint){
  const f = FAMILIES[family];
  word = (word||'').trim().toLowerCase();
  const consecutiveRepeat = !!word && wordOnCooldown(word);
  let ok = false;
  let reason = '';
  if(!word){
    reason = '超時未作答';
  } else if(consecutiveRepeat){
    const remain = WORD_COOLDOWN_ROUNDS - (game.round - game.wordRounds[word]);
    reason = '這個字還在冷卻中，需再間隔 '+Math.max(remain,1)+' 回合才能重複使用';
  } else if(!isValidWord(family, word)){
    reason = '不符合條件（必須是只含英文字母、且包含「'+family+'」的單字）';
  } else if(!p.isHuman){
    ok = true; // 電腦玩家使用內建字庫，已確定為有效單字
  } else if(KNOWN_WORDS.has(word)){
    ok = true; // 本機常見字庫已收錄，直接判定為有效單字
  } else {
    const dictResult = await isRealWord(word);
    if(dictResult === false){
      reason = '字典查詢不到這個字，可能拼錯了';
    } else if(dictResult === null){
      reason = '目前無法連線查字典，且這個字不在常見字庫中';
    } else {
      ok = true;
    }
  }
  if(!ok){
    let teachTip = '';
    if(word){
      const avail = f.words.filter(w=> !wordOnCooldown(w));
      const example = avail[Math.floor(Math.random()*avail.length)];
      if(example) teachTip = '　💡 小提示：像「'+example+'」這樣包含「'+family+'」的字就符合條件喔！';
    }
    p.combo = 0;
    p.streakCounter = 0;
    p.failStreak = (p.failStreak||0) + 1;
    const wordDisplay = word ? '你拼的是「'+word+'」，' : '';
    log((p.isHuman?'你':p.name)+' 拼字挑戰失敗。'+wordDisplay+reason+'。'+teachTip, p.isHuman);
    if(purpose==='move'){ render(); setTimeout(nextTurn, 600); }
    else if(purpose==='buy'){ log('沒有成功購買這塊地。', p.isHuman); render(); setTimeout(nextTurn,600); }
    else if(purpose==='upgrade'){ log('升級挑戰失敗。', p.isHuman); render(); setTimeout(nextTurn,600); }
    else if(purpose==='rent'){ payRent(p, family); }
    else if(purpose==='boss'){ render(); const cb=bossCallback; bossCallback=null; setTimeout(()=>{ if(typeof cb==='function') cb(false); }, 500); }
    else if(purpose==='bossProperty'){ log('超級地產挑戰失敗，這塊地仍然開放給其他人挑戰。', p.isHuman); render(); setTimeout(nextTurn,600); }
    return;
  }

  game.wordRounds[word] = game.round;

  // ── Combo 連續答對系統 ──
  p.combo = (p.combo||0) + 1;
  p.streakCounter = (p.streakCounter||0) + 1;
  if(p.streakCounter>=10) awardAchievement(p,'streak10','連續10次答對：不間斷連續拼字成功 10 次');
  let comboStepBonus = 0;
  if(p.combo===2){ comboStepBonus=1; log('🔥 Combo x2！這次移動額外 +1 步！', p.isHuman); }
  else if(p.combo===3){ comboStepBonus=2; log('🔥🔥 Combo x3！這次移動額外 +2 步！', p.isHuman); }
  else if(p.combo===4){ p.money+=3; log('🔥🔥🔥 Combo x4！額外獲得 3 枚代幣！', p.isHuman); }
  else if(p.combo>=5){
    const keys=Object.keys(p.owned);
    if(keys.length){ const k=keys[Math.floor(Math.random()*keys.length)]; p.owned[k]+=3; log('🌟 Combo x5！隨機一塊地產免費升級！', p.isHuman); }
    else { p.money+=3; log('🌟 Combo x5！目前沒有地產，改領 3 枚代幣！', p.isHuman); }
    awardAchievement(p,'combo5','神來一筆：連續 5 次拼字挑戰成功');
    p.combo = 0;
  }
  if((p.failStreak||0)>=5) awardAchievement(p,'nevergiveup','不放棄：連續失敗 5 次後成功拼對');
  p.failStreak = 0;

  // ── 家族連擊（連續兩／三回合抽到同一家族）──
  const familyRepeat = p._familyRepeatAtDraw || 1;
  if(purpose==='move' && !usedHint && familyRepeat===2){
    p.money += 2;
    log('👯 家族連擊 x2！連續抽到「'+family+'」家族，額外獲得 2 枚代幣！', p.isHuman);
  } else if(purpose==='move' && !usedHint && familyRepeat>=3){
    const keys = Object.keys(p.owned);
    if(keys.length){ const k=keys[Math.floor(Math.random()*keys.length)]; p.owned[k]+=3; log('👯👯 家族連擊 x3！連續三次抽到「'+family+'」家族，隨機一塊地產免費升級！', p.isHuman); }
    p.familyRepeatCount = 0;
  }

  // ── 單字收藏冊 ──
  const isNewWord = !p.collection.has(word);
  p.collection.add(word);
  if(isNewWord && p.collection.size>=20 && !p.collectionBonusGiven){
    p.collectionBonusGiven = true;
    p.money += 5;
    log('📖 '+(p.isHuman?'你':p.name)+' 的單字收藏冊集滿 20 個不同單字，獲得寶箱獎勵 +5 枚代幣！', p.isHuman);
  }
  if(p.collection.size>=30) awardAchievement(p,'wordking','拼字王：累積拼對 30 個不同單字');
  if(p.collection.size>=100) awardAchievement(p,'words100','拼出100字：累積拼對 100 個不同單字');
  if(word.length>=10) awardAchievement(p,'longword','長字高手：拼出 10 個字母以上的單字');

  // ── 字母串家族收藏冊（單一家族收藏完成）──
  checkFamilyAlbum(p, family, word);

  // ── 稀有字獎勵（全場限一次）──
  if(RARE_WORDS.has(word) && !game.rareWordsUsed.has(word)){
    game.rareWordsUsed.add(word);
    p.money += 5;
    log('💎 '+(p.isHuman?'你':p.name)+' 全場第一個拼出稀有字 "'+word+'"，額外獲得 5 枚代幣！', p.isHuman);
  }

  checkMoneyAchievements(p);

  if(purpose==='move'){
    let steps, diceMsg;
    if(usedHint){
      steps = 1;
      diceMsg = '使用提示，固定前進 1 格';
    } else {
      const roll = rollForWord(word);
      steps = roll.steps;
      diceMsg = diceResultText(roll);
    }
    const bonusParts = [];
    if(!usedHint && comboStepBonus>0){ steps += comboStepBonus; bonusParts.push('Combo +'+comboStepBonus); }
    if(!usedHint && p._prevFamilyForChain && p._prevFamilyForChain!==family && word.includes(p._prevFamilyForChain)){
      steps += 2;
      bonusParts.push('⛓️ 字母連鎖(同時含 '+p._prevFamilyForChain+'+'+family+') +2');
    }
    if(!usedHint){
      const lhMult = abilityMultiplier(p,'lighthouse');
      if(lhMult>0){ steps += lhMult; bonusParts.push('🗼 燈塔 +'+lhMult); }
      if(p.permanentDiceBonus){ steps += p.permanentDiceBonus; bonusParts.push('🌈 收藏加成 +'+p.permanentDiceBonus); }
      if(game.activeEvent==='rain'){ steps = Math.max(1, steps-1); bonusParts.push('🌧 下雨 -1'); }
      else if(game.activeEvent==='sunny'){ steps += 1; bonusParts.push('☀️ 晴天 +1'); }
    }
    if(steps>=12) awardAchievement(p,'bigmove','一回合走12步：單次移動達到 12 步以上');
    const bonusText = bonusParts.length ? '（'+bonusParts.join('，')+'）' : '';
    log((p.isHuman?'你':p.name)+' 成功拼出 "'+word+'"！'+diceMsg+'，前進 '+steps+' 格。'+bonusText, p.isHuman);
    movePlayer(p, steps);
  } else if(purpose==='buy'){
    let cost = costForWord(word);
    const slot = p._pendingSlot;
    if(BOARD[slot] && BOARD[slot].ability==='shop') cost = Math.max(1, cost-1);
    offerPurchase(p, family, word, cost);
  } else if(purpose==='upgrade'){
    const slot = p._pendingSlot;
    const propKey = family+':'+slot;
    p.owned[propKey] = (p.owned[propKey]||0) + 1;
    const li = levelIndex(p.owned[propKey]);
    let bonusMsg = '';
    if(BOARD[slot] && BOARD[slot].ability==='school'){
      let bonus = Math.max(1, li);
      if(game.activeEvent==='schoolday') bonus *= 2;
      p.money += bonus;
      bonusMsg = '（🏫 學校地產額外 +'+bonus+' 幣'+(game.activeEvent==='schoolday'?'，校慶加倍！':'')+'）';
    }
    log((p.isHuman?'你':p.name)+' 用單字 "'+word+'" 升級了地產，目前等級：'+LEVELS[li].name+'！'+bonusMsg, p.isHuman);
    tryLetterFusion(p, family, word);
    checkMoneyAchievements(p);
    render(); setTimeout(nextTurn,700);
  } else if(purpose==='rent'){
    log((p.isHuman?'你':p.name)+' 用單字 "'+word+'" 成功免除了過路費！', p.isHuman);
    render(); setTimeout(nextTurn,700);
  } else if(purpose==='boss'){
    log((p.isHuman?'你':p.name)+' 在 Boss Round 中成功拼出 "'+word+'"！', p.isHuman);
    render();
    const cb = bossCallback; bossCallback = null;
    setTimeout(()=>{ if(typeof cb==='function') cb(true); }, 500);
  } else if(purpose==='bossProperty'){
    const slot = p._pendingSlot;
    const propKey = family+':'+slot;
    p.owned[propKey] = 999; // 直接鎖定最高等級
    game.bossPropertyBonus[propKey] = 5;
    if(game.bossPropertySlot===slot) game.bossPropertySlot = null;
    p.bossWins = (p.bossWins||0)+1;
    log('👑 '+(p.isHuman?'你':p.name)+' 用單字 "'+word+'" 拼對了超級地產挑戰，直接奪得永久五星地產（過路費 +5）！', p.isHuman);
    awardAchievement(p,'bossKiller','Boss Killer：奪得一塊超級地產');
    render(); setTimeout(nextTurn,700);
  }
}

function offerPurchase(p, family, word, cost){

    render(famChip(family)+'<p style="margin:6px 0;font-size:13px;">拼對了 "'+word+'"！要花 <b>'+cost+'</b> 枚代幣買下這塊地嗎？'+(p.money<cost?'<br><span style="color:#C0392B;">代幣不足！</span>':'')+'</p>'

function confirmPurchase(p, family, word, cost){
  p.money -= cost;
  const slot = p._pendingSlot;
  const propKey = family+':'+slot;
  p.owned[propKey] = (p.owned[propKey]||0) + 1;
  p.wordCount[family] = (p.wordCount[family]||0)+1;
  log((p.isHuman?'你':p.name)+' 用單字 "'+word+'" 買下了這塊 '+FAMILIES[family].label+' 家族地產！(花費 '+cost+' 幣)', p.isHuman);
  if(Object.keys(p.owned).length>=8) awardAchievement(p,'tycoon','地產大亨：同時擁有 8 塊地產');
  if(game.round<=5){
    p.buysInFirst5 = (p.buysInFirst5||0) + 1;
    if(p.buysInFirst5>=3) awardAchievement(p,'earlybuyer','五回合內買三塊地：起步搶地盤');
  }
  tryLetterFusion(p, family, word);
  checkMoneyAchievements(p);
  render(); setTimeout(nextTurn,700);
}

function movePlayer(p, steps){
  let stepsLeft = steps;
  let passedGo = false;
  function hopStep(){
    if(stepsLeft<=0){
      if(passedGo){
        let goBonus = 2;
        let bankMsg = '';
        const bankMult = abilityMultiplier(p,'bank');
        if(bankMult>0){ goBonus += bankMult; bankMsg = '（🏦 銀行地產額外 +'+bankMult+'）'; }
        p.money += goBonus;
        log((p.isHuman?'你':p.name)+' 經過出發點，獲得 '+goBonus+' 枚代幣獎勵！'+bankMsg, p.isHuman);
        checkMoneyAchievements(p);
      }
      render();
      setTimeout(()=> resolveLanding(p), 350);
      return;
    }
    p.pos = (p.pos+1)%24;
    if(p.pos===0) passedGo = true;
    positionTokens(true);
    stepsLeft--;
    setTimeout(hopStep, 260);
  }
  hopStep();
}

      p.money += 3;

  } else if(sq.type==='goreview'){

function payRent(p, family, rentOverride){
  const slot = p.pos!==undefined ? p.pos : null;
  const key = family+':'+p.pos;
  const owner = ownerOf(family, p.pos);
  let rent = rentOverride;
  if(rent===undefined){
    const li = owner? levelIndex(owner.owned[key]) : 0;
    rent = LEVELS[li].rent;
  }
  const ownerLevel = owner ? Math.max(1, levelIndex(owner.owned[key])) : 1;
  if(BOARD[p.pos] && BOARD[p.pos].ability==='castle'){
    rent = Math.ceil(rent * (1 + 0.25*ownerLevel));
  }
  if(game.bossPropertyBonus[key]) rent += game.bossPropertyBonus[key];
  if(p.money >= rent){
    p.money -= rent;
    if(owner){
      owner.money += rent;
      if(rent>=10) awardAchievement(owner,'bigrent','收到10元以上租金：單筆過路費收入達 10 枚以上');
      if(BOARD[p.pos].ability==='forest'){
        const bonus = 2*ownerLevel;
        owner.money += bonus;
        log((p.isHuman?'你':p.name)+' 支付了 '+rent+' 枚代幣的過路費。（🌲 森林地產讓 '+owner.name+' 額外獲得 '+bonus+' 幣）', p.isHuman);
      } else {
        log((p.isHuman?'你':p.name)+' 支付了 '+rent+' 枚代幣的過路費。', p.isHuman);
      }
      checkMoneyAchievements(owner);
    } else {
      log((p.isHuman?'你':p.name)+' 支付了 '+rent+' 枚代幣的過路費。', p.isHuman);
    }
  } else {
    const keys = Object.keys(p.owned);
    if(keys.length>0){
      if(owner) owner.money += p.money;
      p.money = 0;
      const k = keys[0];
      delete p.owned[k];
      log((p.isHuman?'你':p.name)+' 代幣不足，只能支付部分過路費，並被迫變賣一塊地產抵債。', p.isHuman);
    } else {
      // 破產（方案B）：名下已無地產可變賣，直接扣除當下代幣的 50% 作為懲罰，不出局、繼續遊戲

      p.money -= penalty;

    }
  }
  render();
  setTimeout(nextTurn, 700);
}

function drawCard(p, deck, deckName){
  const card = deck[Math.floor(Math.random()*deck.length)];
  log((p.isHuman?'你':p.name)+' 抽到「'+card.name+'」（'+deckName+'）。', p.isHuman);
  const moved = card.run(p);
  if(moved){
    return;
  }
  render();
  setTimeout(nextTurn, 700);
}

function endOfLanding(p){
  render();
  setTimeout(nextTurn, 600);
}

function scoreOf(p){
  let val = p.money;
  for(const k in p.owned){
    const li = levelIndex(p.owned[k]);
    val += LEVEL_VALUE[li];
    const idx = parseInt(k.split(':')[1],10);
    if(BOARD[idx] && BOARD[idx].ability==='garden') val += 2*Math.max(1,li);
  }
  return val;
}

function starRating(p){
  const dims = [];
  dims.push(Math.min(1, (p.collection?p.collection.size:0)/40));
  dims.push(Math.min(1, (p.familyMastered?p.familyMastered.size:0)/8));
  dims.push(Math.min(1, Object.keys(p.owned).length/8));
  dims.push(Math.min(1, (p.achievements?p.achievements.size:0)/ACHIEVEMENT_LABELS.length));
  dims.push((p.bossWins||0)>0 ? 1 : 0);
  const avg = dims.reduce((a,b)=>a+b,0)/dims.length;
  return Math.max(1, Math.round(avg*5));
}
function starTitle(stars){
  if(stars>=5) return '拼字大師';
  if(stars===4) return '字彙高手';
  if(stars===3) return '認真學習家';
  if(stars===2) return '努力新手';
  return '初心者';
}
function endGame(reasonMsg){
  game.gameOver = true;
  game.players.forEach(p=>{
    if((p.hintsUsed||0)===0 && (p.turns||0)>=ROUNDS) awardAchievement(p,'noHints','不用提示通關：全場完全不靠提示');
  });
  const ranked = [...game.players].sort((a,b)=> scoreOf(b)-scoreOf(a));
  const overlay = document.getElementById('overlay');
  overlay.style.display='flex';
  overlay.innerHTML = '<div class="card">'
    +'<h2>遊戲結束！</h2>'
    +(reasonMsg ? '<p style="color:#C0392B;font-size:13px;font-weight:700;margin-bottom:8px;">'+reasonMsg+'</p>' : '')
    +'<p style="color:#7A7261;font-size:13px;margin-bottom:14px;">依代幣＋地產價值計算最終總分</p>'
    + ranked.map((p,i)=>{
        const achList = p.achievements && p.achievements.size ? '<div style="font-size:10.5px;color:#8A7F63;text-align:left;margin:2px 0 4px 19px;">🏅 '+ACHIEVEMENT_LABELS.filter(a=>p.achievements.has(a.key)).map(a=>a.label).join('、')+'</div>' : '';
        const stars = starRating(p);
        const starLine = '<div style="font-size:11px;color:#B8860B;text-align:left;margin:0 0 6px 19px;">'+'⭐'.repeat(stars)+'☆'.repeat(5-stars)+' '+starTitle(stars)+'</div>';
        return '<div>'
          +'<div class="rank"><span><span class="dot" style="background:'+p.color+';display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;"></span>'+(i===0?'🏆 ':'')+p.name+(p.out?'（出局）':'')+'</span><span>'+scoreOf(p)+' 分</span></div>'
          + starLine
          + achList
        +'</div>';
      }).join('')
    +'<button class="btn primary" id="playAgain" style="margin-top:16px;width:100%;">再玩一次</button>'
    +'</div>';
  document.getElementById('playAgain').onclick = ()=>{ overlay.style.display='none'; showSetup(); };
}
